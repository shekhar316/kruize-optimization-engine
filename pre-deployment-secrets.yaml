# Pre-deployment Secrets for Kruize
# 
# IMPORTANT: This file contains secrets that MUST be created BEFORE deploying Kruize.
# These secrets are NOT included in the submission to comply with Catalogathon requirements.
#
# Instructions:
# 1. Update the secret values below with your actual credentials
# 2. Apply this file to your cluster BEFORE deploying Kruize:
#    kubectl apply -f pre-deployment-secrets.yaml
# 3. Verify the secret exists:
#    kubectl get secret sccat-kruize-db-credentials -n openshift-tuning
#
# Security Note:
# - Never commit actual credentials to Git
# - Use your organization's secret management system in production
# - These are example values for demo purposes only

---
apiVersion: v1
kind: Secret
metadata:
  name: sccat-kruize-db-credentials
  namespace: openshift-tuning
  labels:
    app.kubernetes.io/name: sccat-kruize-db
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # PostgreSQL credentials - CHANGE THESE VALUES
  POSTGRES_USER: kruize_admin
  POSTGRES_PASSWORD: CHANGE_ME_TO_SECURE_PASSWORD
  POSTGRES_DB: kruizedb
  
  # Additional PostgreSQL environment variables
  POSTGRESQL_USER: kruize_admin
  POSTGRESQL_PASSWORD: CHANGE_ME_TO_SECURE_PASSWORD
  POSTGRESQL_DATABASE: kruizedb


