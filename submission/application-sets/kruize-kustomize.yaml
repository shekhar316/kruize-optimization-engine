apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kruize-kustomize
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
      - cluster: local
        url: https://kubernetes.default.svc
  template:
    metadata:
      name: 'kruize-{{cluster}}'
      labels:
        catalogathon: "true"
        service: kruize
    spec:
      project: default
      source:
        repoURL: https://github.com/IBM/catalogathon-gitops-run
        targetRevision: main
        path: services/kruize/v1/manifests
      destination:
        server: '{{url}}'
        namespace: openshift-tuning
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

