apiVersion: v1
kind: Service
metadata:
  name: kruize-db-service
  namespace: openshift-tuning
  labels:
    app.kubernetes.io/name: kruize-db-service
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: 5432
  selector:
    app.kubernetes.io/name: sccat-kruize-db

