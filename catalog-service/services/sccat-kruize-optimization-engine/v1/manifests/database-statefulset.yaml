apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sccat-kruize-db
  namespace: openshift-tuning
  labels:
    app.kubernetes.io/name: sccat-kruize-db
    app.kubernetes.io/component: database
spec:
  serviceName: sccat-kruize-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sccat-kruize-db
  template:
    metadata:
      labels:
        app: sccat-kruize-db
        app.kubernetes.io/name: sccat-kruize-db
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: dev-registry-quay-catalogathon-registry.apps.hthon-dev.svl.ibm.com/sccat-7aa7afd3-ca2a-43e2-81a8-8f5e22900927/postgres:catalogathon
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sccat-kruize-db-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: sccat-kruize-db-credentials
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: sccat-kruize-db-credentials
              key: POSTGRES_DB
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sccat-kruize-db-credentials
              key: POSTGRESQL_PASSWORD
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: sccat-kruize-db-credentials
              key: POSTGRESQL_USER
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: sccat-kruize-db-credentials
              key: POSTGRESQL_DATABASE
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          # Let OpenShift assign UID automatically
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
      labels:
        app.kubernetes.io/name: kruize-db
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi

