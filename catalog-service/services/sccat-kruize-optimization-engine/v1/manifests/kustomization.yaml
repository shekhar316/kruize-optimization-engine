apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base resources for Kruize deployment
resources:
  - namespace.yaml
  - kruize-crd.yaml
  - operator-serviceaccount.yaml
  - operator-role.yaml
  - operator-rolebinding.yaml
  - operator-clusterrole.yaml
  - operator-clusterrolebinding.yaml
  - operator-deployment.yaml
  - operator-service.yaml
  - database-statefulset.yaml
  - database-service.yaml
  - kruize-configmap.yaml
  - kruize-instance.yaml
  - metering-configmap.yaml

patchesStrategicMerge:
  - kruize-sidecar-patch.yaml

# Common labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/name: sccat-kruize-optimization-engine
      app.kubernetes.io/part-of: sccat-kruize-optimization
      app.kubernetes.io/managed-by: kustomize
      sovereign-core/service: sccat-kruize-optimization-engine

# Namespace where all resources will be created (OpenShift standard)
namespace: openshift-tuning

# Images to use (can be overridden in overlays)
images:
  - name: kruize-operator
    newName: quay.io/rh-ee-shesaxen/kruize-operator
    newTag: "catalogathon-fixed"
  - name: kruize-autotune
    newName: quay.io/kruize/autotune
    newTag: "0.9"
  - name: kruize-ui
    newName: quay.io/kruize/kruize-ui
    newTag: "0.1.0"
  - name: kruize-optimizer
    newName: quay.io/kruize/kruize-optimizer
    newTag: "0.0.1"
  - name: postgres
    newName: quay.io/kruizehub/postgres
    newTag: "15.2"

# ConfigMap generator for common configuration
configMapGenerator:
  - name: sccat-kruize-env-config
    literals:
      - CLUSTER_TYPE=openshift
      - LOG_LEVEL=INFO
      - PROMETHEUS_URL=http://prometheus-k8s.openshift-monitoring.svc:9090

# IMPORTANT: Database secrets must be pre-provisioned before deployment
# See: ../../../pre-deployment-secrets.yaml
# Apply with: kubectl apply -f pre-deployment-secrets.yaml

