apiVersion: v1
kind: ConfigMap
metadata:
  name: sccat-kruize-config
  namespace: openshift-tuning
  labels:
    app.kubernetes.io/name: sccat-kruize-optimization-engine
    app.kubernetes.io/component: configuration
data:
  # Kruize configuration for OpenShift
  cluster_type: "openshift"
  log_level: "INFO"
  prometheus_url: "http://prometheus-k8s.openshift-monitoring.svc:9090"
  
  # Database configuration - always enabled
  db_host: "sccat-kruize-db.openshift-tuning.svc.cluster.local"
  db_port: "5432"
  db_name: "kruizedb"
  
  # Optimization settings - all features enabled by default
  recommendation_interval: "300"
  data_retention_days: "30"

